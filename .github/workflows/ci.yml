name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Build dan tes unit
        run: npm run build

      - name: Pastikan hasil build sudah di-commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Hasil build berbeda dari yang di-commit. Jalankan 'npm run build' lalu commit perubahannya."
            git status --porcelain
            git diff --stat
            exit 1
          fi

      - name: Pastikan Google Chrome tersedia
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          else
            npx playwright install --with-deps chrome
          fi

      - name: Tes end-to-end
        run: npm run test:e2e

      - name: Unggah laporan Playwright bila gagal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
